name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned upstream validator. Bump deliberately.
  AGENTSKILLS_SHA: 69ef37e9424c0a7ea9dd2293b559e43ec8176379

jobs:
  validate:
    name: Agent Skills spec and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validators
        run: |
          python -m pip install 'PyYAML==6.0.2'
          python -m pip install "git+https://github.com/agentskills/agentskills.git@${AGENTSKILLS_SHA}#subdirectory=skills-ref"
      - name: Validate Agent Skills spec
        run: |
          for skill in skills/*/; do
            skills-ref validate "$skill"
          done
      - name: Check metadata and licenses
        run: python scripts/check_packaging.py
