name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validator dependency
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Validate skill packages and references
        run: python scripts/validate.py
      - name: Verify isolated installs with skills CLI 1.7.0
        run: python scripts/check_isolated_installs.py
