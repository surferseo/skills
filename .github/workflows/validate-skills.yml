name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

env:
  # Pinned upstream validators. Bump deliberately.
  AGENTSKILLS_SHA: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
  OPENAI_SKILLS_SHA: 49f948faa9258a0c61caceaf225e179651397431

jobs:
  spec:
    name: Agent Skills spec (skills-ref)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the reference validator from agentskills.io
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git@${AGENTSKILLS_SHA}#subdirectory=skills-ref"
      - name: skills-ref validate
        run: for skill in skills/*/; do skills-ref validate "$skill"; done

  openai:
    name: OpenAI skill validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2'
      - name: Fetch quick_validate.py from openai/skills
        run: curl -sSfL "https://raw.githubusercontent.com/openai/skills/${OPENAI_SKILLS_SHA}/skills/.system/skill-creator/scripts/quick_validate.py" -o /tmp/quick_validate.py
      - name: quick_validate.py
        run: for skill in skills/*/; do python /tmp/quick_validate.py "$skill"; done

  claude:
    name: Claude plugin validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate --strict
        run: claude plugin validate . --strict

  packaging:
    name: Packaging (openai.yaml, licenses, links, skills CLI installs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: agents/openai.yaml, per-skill LICENSE, relative links
        run: npm run check:packaging
      - name: Install every skill into empty Codex and Claude Code projects
        run: npm run check:installs

  links:
    name: External links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm every documented URL answers
        run: npm run check:links
